<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FastAPI Streaming Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f7fb;
      color: #1c2333;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 820px; margin: 0 auto; padding: 48px 20px 64px; }
    h1 { font-size: 26px; margin: 0 0 6px; }
    p.lead { color: #5c6478; margin: 0 0 28px; }
    .card {
      background: #fff;
      border: 1px solid #e4e8f0;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(23, 34, 59, .05);
    }
    textarea {
      width: 100%;
      min-height: 84px;
      resize: vertical;
      border: 1px solid #d7dce8;
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      outline: none;
    }
    textarea:focus { border-color: #2f6bff; box-shadow: 0 0 0 3px rgba(47, 107, 255, .12); }
    .actions { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
    button, .link-button {
      border: 0;
      border-radius: 8px;
      padding: 9px 16px;
      font: inherit;
      cursor: pointer;
      background: #2f6bff;
      color: #fff;
    }
    button:disabled { opacity: .55; cursor: default; }
    button.secondary, .link-button {
      background: #eef3ff;
      color: #2f5bd6;
      text-decoration: none;
    }
    #status { color: #78819a; font-size: 13px; margin-left: auto; }
    pre {
      margin: 18px 0 0;
      padding: 16px;
      min-height: 180px;
      background: #0f172a;
      color: #dce6ff;
      border-radius: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      font: 13px/1.65 "SFMono-Regular", Consolas, monospace;
    }
    .hint { margin-top: 14px; font-size: 13px; color: #78819a; }
    code { background: #eef3ff; color: #2f5bd6; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
<main>
  <h1>FastAPI Streaming Demo</h1>
  <p class="lead">The response below is generated on the server token by token and rendered as it arrives.</p>

  <section class="card">
    <textarea id="prompt">Explain why streaming matters for LLM applications.</textarea>
    <div class="actions">
      <button id="send">Start stream</button>
      <a class="link-button" href="/api/export/stream?rows=1000">Download CSV (streamed)</a>
      <span id="status">idle</span>
    </div>
    <pre id="output">Waiting for a request…</pre>
    <div class="hint">
      Endpoints: <code>POST /api/chat/stream</code>, <code>GET /api/numbers/stream</code>,
      <code>GET /api/export/stream</code>
    </div>
  </section>
</main>
<script>
  const output = document.getElementById('output');
  const status = document.getElementById('status');
  const send = document.getElementById('send');

  send.addEventListener('click', async () => {
    const prompt = document.getElementById('prompt').value.trim();
    if (!prompt) return;
    output.textContent = '';
    status.textContent = 'streaming…';
    send.disabled = true;
    const started = performance.now();
    let firstChunkAt = null;

    try {
      const response = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt }),
      });
      if (!response.ok) throw new Error('HTTP ' + response.status);

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const events = buffer.split('\n\n');
        buffer = events.pop();
        for (const event of events) {
          const line = event.split('\n').find((l) => l.startsWith('data: '));
          if (!line) continue;
          const data = line.slice(6);
          if (data === '[DONE]') {
            status.textContent = 'done in ' + Math.round(performance.now() - started) + ' ms';
            continue;
          }
          const chunk = JSON.parse(data);
          if (chunk.delta) {
            if (firstChunkAt === null) firstChunkAt = Math.round(performance.now() - started);
            output.textContent += chunk.delta;
          }
        }
      }
      if (firstChunkAt !== null) {
        status.textContent += ' · first token ' + firstChunkAt + ' ms';
      }
    } catch (error) {
      status.textContent = 'error';
      output.textContent = String(error);
    } finally {
      send.disabled = false;
    }
  });
</script>
</body>
</html>
